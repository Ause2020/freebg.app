<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--app-head-start-->
    <title>Free Background Remover – No Watermark, Unlimited | FreeBG</title>
    <meta
      name="description"
      content="Remove image backgrounds free and unlimited. No watermark, no signup, no uploads. Full HD/4K resolution, processed privately in your browser."
    />
    <!--app-head-end-->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#6C5CE7" />

    <link rel="preconnect" href="https://staticimgly.com" crossorigin />
    <link rel="dns-prefetch" href="https://staticimgly.com" />

    <script>
      // Apply the stored theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('freebg-theme')
          var dark =
            stored === 'dark' ||
            (!stored &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
